name: Test formula

# Verifies that the formula actually installs, on both platforms Homebrew serves. The Linux
# job is the one that matters most: the main repo is developed on macOS, so this is where the
# Homebrew-on-Linux build path gets exercised at all.
on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, to catch a dependency or Homebrew change breaking the build even when nothing here
  # has changed.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  install:
    name: brew install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # setup-homebrew links this checkout in as the tap, so `msavox/clee/clee` already
      # resolves to the formula in this commit — a pull request tests its own version.
      - name: Confirm the formula under test is this checkout
        run: |
          set -euo pipefail
          brew tap
          diff Formula/clee.rb "$(brew --repository msavox/clee)/Formula/clee.rb"

      - name: Install
        run: brew install --build-from-source --verbose msavox/clee/clee

      - name: brew test
        run: brew test msavox/clee/clee

      - name: brew audit
        run: brew audit --strict msavox/clee/clee

      # The formula's own test block covers --version/--help; this checks the install laid
      # out what the caveats promise.
      - name: Check the installed layout
        run: |
          set -euo pipefail
          command -v clee
          clee --version
          ls "$(brew --prefix clee)/share/clee/fonts"
